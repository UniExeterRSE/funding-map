name: External link check

# Funders move and retire their pages, so check every link weekly and on demand. Third-party hosts rate-limit and
# bot-wall CI runners at random, so this gates nothing: a red run means look, not that the site is broken. Exclude
# a host that always refuses the runner in lychee.toml.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
      - run: pixi run build
      - run: pixi run linkcheck
