name: Build and deploy to GitHub Pages

# Every pull request is built, which validates each opportunity against src/schema.yml; only main is deployed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so an opportunity whose deadline has passed shows as closed without anyone pushing
  # (bin/opportunities.py, src/filters/opportunity.lua).
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
      - name: Validate opportunities
        run: pixi run check
      # Also runs bin/opportunities.py after the render, which writes opportunities.json.
      - name: Render
        run: pixi run build
      # Offline and takes milliseconds, so a third party cannot turn it red; external links are checked by
      # linkcheck.yml, which gates nothing.
      - name: Check internal links
        run: pixi run linkcheck-internal
      # Only main is published, whatever triggered the run: a manual run can be pointed at any branch.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src/docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
